// CloudKit's client protocol, as far as reading Find My accessory records requires.
//
// Authored from a protocol specification, not from any existing implementation. The
// specification's own source is documented at:
//   https://github.com/parawanderer/OpenTagViewer/tree/main/docs/findmy-export
// Section references below ("S4 §3.3") point into that document set: S3 = keychain trust,
// S4 = CloudKit, S5 = PCS decryption.
//
// Only the read path is modelled. The real protocol also writes, deletes, shares and
// subscribes; those operations are named in S4 §3.2 and deliberately absent here.
//
// Two conventions worth knowing before editing this file:
//
//   * proto2, not proto3, and every field is `optional`. This is not stylistic. S4 §3.3
//     needs three fields sent with the value 0, and proto3 does not serialise a field set
//     to its default, so they would silently vanish from the wire. proto2's explicit
//     presence sends them.
//
//   * Fields whose enumeration the specification admits is incomplete are declared as
//     `int32`, not as enums. A proto2 enum discards a value it does not know about, so an
//     unrecognised error code would decode as absent rather than as itself. Constants for
//     the known values live in `findmy/cloudkit/constants.py`.
//
// Anything still marked ASSUMED below is a field number or type the specification does not
// state. Everything this client exercises has since been confirmed against a live account,
// so what remains marked is what nothing has yet sent or received.

syntax = "proto2";

package findmy.cloudkit;

option java_package = "com.sacca.openfinder.apple.proto.cloudkit";
option java_multiple_files = true;
option optimize_for = LITE_RUNTIME;

// ---------------------------------------------------------------------------
// Enums (S4 §3.3, §3.4)
//
// None of these use zero, so a defaulted field is not a valid value -- they must be set
// explicitly rather than left to protobuf's default.
// ---------------------------------------------------------------------------

enum ContainerEnvironment {
  PRODUCTION = 1;
  SANDBOX = 2;
}

enum Database {
  PRIVATE_DB = 1;
  PUBLIC_DB = 2;
  SHARED_DB = 3;
}

enum IsolationLevel {
  ZONE = 1;
  OPERATION = 2;
}

// ---------------------------------------------------------------------------
// Identifiers (S4 §3.4)
//
// Nothing in CloudKit is addressed by a bare string.
// ---------------------------------------------------------------------------

message Identifier {
  enum Type {
    RECORD = 1;
    DEVICE = 2;
    SUBSCRIPTION = 3;
    SHARE = 4;
    COMMENT = 5;
    RECORD_ZONE = 6;
    USER = 7;
  }

  optional string name = 1;
  optional Type type = 2;
}

// A zone is a name plus its owner. The owner is the `cloudKitUserId` handed back by
// ckAppInit (S4 §2.3) -- which is why that value has to be kept: without it no private
// zone can be named.
message RecordZoneIdentifier {
  optional Identifier value = 1;
  optional Identifier owner_identifier = 2;
  optional ContainerEnvironment environment = 3;
}

// A record is a name plus the zone it lives in.
message RecordIdentifier {
  optional Identifier value = 1;
  optional RecordZoneIdentifier zone_identifier = 2;
}

// ---------------------------------------------------------------------------
// Operation envelope (S4 §3.2)
// ---------------------------------------------------------------------------

// The operation is declared twice -- once as this `type`, once by which high-numbered
// field of RequestOperation is populated -- and the two must agree.
//
// `type` is field 2. Field 1 is a string, and putting the type there encodes a varint
// where the server expects a length-delimited string; the result is HTTP 500 with an
// empty body and nothing to decode.
message Operation {
  optional string operation_uuid = 1;
  optional int32 type = 2;
  optional bool synchronous_mode = 3;
  optional bool last = 4;
}

message RequestOperation {
  // S4 §3.3. Large and mostly optional; what is modelled here is what the specification
  // gives values for.
  message Header {
    // Left unset deliberately. Operations are authenticated by the x-cloudkit-authtoken
    // HTTP header (S4 §3.2.0); sending the CloudKit token here does not authenticate
    // anything.
    optional string user_token = 1;

    optional string application_container = 2;
    optional string application_bundle = 3;
    optional string application_version = 4;

    optional Identifier device_identifier = 7;
    optional string device_software_version = 8;
    optional string device_hardware_version = 9;
    optional string device_library_name = 10;
    optional string device_library_version = 11;  // ASSUMED string; the value is "1970"
    optional string device_protocol_version = 16;
    optional string mmcs_protocol_version = 18;

    optional ContainerEnvironment application_container_environment = 19;
    optional string device_assigned_name = 21;

    // Required even for a read: omitting it is rejected with BAD_SYNTAX and the message
    // "deviceHardwareID is required field". 32 hex characters, generated once and stable.
    optional string device_hardware_id = 22;

    optional Database target_database = 23;
    optional IsolationLevel isolation_level = 25;
    optional string group = 26;
    optional string device_serial = 33;

    // Three fields with no meaningful name in any schema, sent as constants. A server
    // that expects them will not say so.
    optional uint32 unknown_29 = 29;
    optional uint32 unknown_34 = 34;
    optional uint32 unknown_35 = 35;
  }

  optional Header header = 1;
  optional Operation request = 2;

  // The field number equals the operation type. Only the read operations are modelled;
  // 200 zoneSave, 202 zoneDelete, 210 recordSave, 214 recordDelete, 220 queryRetrieve and
  // 1101 functionInvoke exist and are not implemented here.
  optional ZoneRetrieveRequest zone_retrieve_request = 201;
  optional RetrieveZoneChangesRequest retrieve_zone_changes_request = 203;
  optional RecordSaveRequest record_save_request = 210;
  optional RetrieveChangesRequest retrieve_changes_request = 213;
  optional FunctionInvokeRequest function_invoke_request = 1101;
}

// Calling a server-side function, which is how Cuttlefish -- the trust-circle service --
// is reached. It rides on CloudKit rather than being a service of its own.
//
// There are two layers of protobuf here. `parameters` carries an entirely separate
// message that CloudKit neither parses nor validates, so a malformed inner message
// produces a *successful* CloudKit operation carrying a payload that fails to decode --
// not a CloudKit error. Anything decoding `serialized_result` must say which layer failed.
message FunctionInvokeRequest {
  optional string service = 1;
  optional string name = 2;
  optional bytes parameters = 3;
}

message FunctionInvokeResponse {
  optional bytes serialized_result = 1;
}

// ---------------------------------------------------------------------------
// Writing a record (S4 ss4)
// ---------------------------------------------------------------------------

// The only write this project has a use for: saving a BeaconNamingRecord to rename an
// accessory on the owner's own account.
//
// `merge` is not a convenience. With it false the server drops every field the request
// does not carry, so a rename that sends only `name` deletes `associatedBeacon` -- the
// join key that makes the record findable at all. Send the whole record and set merge
// anyway; the flag is the safety net, not the plan.
message RecordSaveRequest {
  optional Record record = 1;
  optional bool merge = 2;

  // 2 creates, 3 updates.
  optional int32 save_semantics = 6;

  optional string zone_protection_info_tag = 7;

  // The tag the record CURRENTLY carries. The save checks it and replaces it, so this
  // serialises concurrent writes: a stale tag is a lost update rather than an error to
  // retry with the same value. Re-fetch, take the new tag, rebuild the write.
  optional string record_protection_info_tag = 8;
}

message RecordSaveResponse {
  // The record as the server now holds it.
  optional Record server_fields = 4;
}

message ResponseOperation {
  // ASSUMED int64. The specification names the field but not its type; a wire-type
  // mismatch decodes as an unknown field rather than failing, so a wrong guess here is
  // survivable.
  optional int64 operation_cost = 1;

  optional Operation response = 2;
  optional Result result = 3;

  // Bundled sub-requests, shape unspecified. Held as opaque bytes so that a
  // length-delimited payload of any shape round-trips rather than failing to parse.
  repeated bytes bundled = 4;

  // At the same field number as the request.
  optional ZoneRetrieveResponse zone_retrieve_response = 201;
  optional RetrieveZoneChangesResponse retrieve_zone_changes_response = 203;
  optional RecordSaveResponse record_save_response = 210;
  optional RetrieveChangesResponse retrieve_changes_response = 213;
  optional FunctionInvokeResponse function_invoke_response = 1101;
}

// Check this first. PARTIAL exists, so a batched request can half-succeed and an
// implementation that treats anything non-SUCCESS as total failure discards good results.
message Result {
  optional int32 code = 1;
  optional Error error = 2;
}

message Error {
  // clientError and serverError are wrapper messages, not bare enums: each is a message
  // whose field 1 holds the code. Declaring them as plain integers decodes as
  // "invalid wire type: LengthDelimited (expected Varint)".
  message ClientError {
    optional int32 code = 1;
  }

  message ServerError {
    optional int32 code = 1;
  }

  optional ClientError client_error = 1;
  optional ServerError server_error = 2;
  optional int32 retry_after_seconds = 3;
  optional string error_description = 4;
  optional string error_key = 5;
  optional string error_internal = 6;
  optional ExtensionError extension_error = 7;
}

// ASSUMED field numbers throughout: the specification names the three members but not
// their tags.
message ExtensionError {
  optional string extension_name = 1;
  optional int32 type_code = 2;
  optional bytes extension_payload = 3;
}

// ---------------------------------------------------------------------------
// Protection (S4 §3.7)
//
// The input to Stage 5. `protection_info` is DER-encoded ASN.1, not protobuf -- the one
// place in this protocol where the encoding changes.
// ---------------------------------------------------------------------------

message ProtectionInfo {
  optional bytes protection_info = 1;
  optional string protection_info_tag = 2;
}

// ---------------------------------------------------------------------------
// Zones (S4 §3.2.3)
// ---------------------------------------------------------------------------

message Zone {
  optional RecordZoneIdentifier zone_identifier = 1;
  optional string etag = 2;

  optional ProtectionInfo protection_info = 3;
  optional ProtectionInfo record_protection_info = 6;
}

// Omitting the identifier asks for every zone.
message ZoneRetrieveRequest {
  optional RecordZoneIdentifier zone_identifier = 1;
}

message ZoneRetrieveResponse {
  repeated ZoneSummary zone_summary = 1;
}

message ZoneSummary {
  optional Zone target_zone = 1;

  // Continuation tokens are held as opaque bytes deliberately. Whether the server encodes
  // them as a message or as a byte string does not matter as long as they are handed back
  // unaltered, and bytes round-trips both.
  optional bytes current_server_continuation_token = 2;
  optional bytes client_change_token = 3;

  optional int64 device_count = 4;
  optional int64 asset_quota_usage = 5;
  optional int64 metadata_quota_usage = 6;
}

// ---------------------------------------------------------------------------
// Changes (S4 §3.5)
//
// The main fetch is a changes operation rather than a listing, because CloudKit's model
// is incremental sync. Note the paths call these "sync".
// ---------------------------------------------------------------------------

message RetrieveZoneChangesRequest {
  optional bytes sync_continuation_token = 1;
  optional int32 max_changed_zones = 2;
}

// ASSUMED field numbers: the specification names the three members but not their tags.
message ChangedZone {
  optional RecordZoneIdentifier identifier = 1;
  optional int32 change_type = 2;
  optional int32 delete_type = 3;
}

// ASSUMED field numbers throughout.
message RetrieveZoneChangesResponse {
  repeated ChangedZone changed_zone = 1;
  optional bytes sync_continuation_token = 2;
  optional int32 status = 3;
}

message RetrieveChangesRequest {
  // Omit on a first run; everything is returned.
  optional bytes sync_continuation_token = 1;

  optional RecordZoneIdentifier zone_identifier = 2;

  // ASSUMED repeated string. Omitted entirely by this client, which wants every field.
  repeated string requested_fields = 3;

  optional int32 max_changes = 4;
  repeated int32 requested_changes_types = 5;
  optional bool newest_first = 7;
  optional bool ignore_calling_device_changes = 8;
  optional bool include_mergeable_deltas = 9;
}

message RecordChange {
  optional RecordIdentifier identifier = 1;
  optional string etag = 2;

  optional NameWrapper record_type = 3;

  optional int32 type = 4;
  optional Record record = 5;
}

message RetrieveChangesResponse {
  repeated RecordChange record_change = 1;
  optional bytes sync_continuation_token = 2;

  // Everything below is carried but not needed to read accessories. They are modelled so
  // that their presence does not read as a schema fault -- an unmodelled field is
  // indistinguishable from a field number guessed wrong, and these arrive on every page.
  // Those whose shape the specification does not give are held as opaque bytes.
  optional bytes client_change_token = 3;
  optional int32 status = 4;
  repeated bytes changed_shares = 5;
  repeated bytes pending_archived_records = 6;
  repeated bytes changed_deltas = 7;
  optional bytes sync_obligations = 8;
  optional bytes zone_attributes_changes = 12;
}

// ---------------------------------------------------------------------------
// Records (S4 §3.6)
// ---------------------------------------------------------------------------

// A string carried inside a wrapper message, with the string at field 1.
//
// Three fields use this shape: a record's type, a change's recordType, and a field's
// identifier. It is worth knowing that all three are wrappers rather than bare strings,
// because both are length-delimited on the wire -- so a reader who declares the wrong one
// does not lose a field, it raises a decode error that takes the whole response with it.
message NameWrapper {
  optional string name = 1;
}

// What a field's `reference_value` carries. A reference names another record, and the
// name is what a keychain item's `parentkeyref` and a pointer's `item` are read for.
//
// ASSUMED field numbers: the specification says a reference's record identifier names the
// target without giving the wrapper's own tags. Readers here scan for a submessage that
// parses as a RecordIdentifier rather than trusting field 1, so a wrong guess costs
// nothing -- see `reference_name`.
message Reference {
  optional RecordIdentifier record_identifier = 1;
  optional int32 action = 2;
}

message Record {
  // A tagged union: a `type` discriminator plus whichever typed field is populated.
  //
  // `type` describes the PLAINTEXT, not the ciphertext. Every field of every record in
  // BeaconStore comes back with is_encrypted set while carrying a type of STRING_TYPE,
  // INT64_TYPE, DATE_TYPE and so on. Branch on `is_encrypted`, and use `type` only to
  // decide how to interpret what decryption yields; switching on `type` alone reads
  // ciphertext as a string.
  message Value {
    optional int32 type = 1;
    optional bytes bytes_value = 2;
    optional int64 signed_value = 4;
    optional double double_value = 5;

    // Held opaque: these are messages whose internals the specification does not give,
    // and none of them is needed to read accessory key material. A field this client
    // cares about is encrypted, which means its payload arrives in bytes_value.
    optional bytes date_value = 6;
    optional string string_value = 7;
    optional bytes location_value = 8;
    optional bytes reference_value = 9;
    optional bytes asset_value = 10;

    repeated Value list_values = 11;
    optional bool is_encrypted = 13;
  }

  message Field {
    optional NameWrapper identifier = 1;
    optional Value value = 2;
  }

  optional string etag = 1;
  optional RecordIdentifier record_identifier = 2;
  optional NameWrapper type = 3;
  optional Identifier created_by = 4;

  // Creation and modification times. Modelled as an empty message: it is stated to be a
  // message, its members are not specified, and nothing here needs them. Its contents
  // survive as unknown fields.
  optional TimeStatistics time_statistics = 5;

  repeated Field record_field = 7;
  optional Identifier modified_by = 9;

  // Which PCS key protects this record -- the input to Stage 5. Present on every record
  // observed; the zone-level record_protection_info and the record-level pcs_key were
  // both absent, and an implementation must not require either.
  optional ProtectionInfo protection_info = 13;

  optional int32 permission = 15;
  optional bytes pcs_key = 24;
}

message TimeStatistics {}

// What a decrypted field's plaintext parses as -- for every declared type except
// ENCRYPTED_BYTES_TYPE, whose plaintext is raw bytes with no wrapper at all.
//
// The field numbers are not contiguous and do not match Record.Field.Value's, so this is
// its own message rather than a reuse of that one.
message EncryptedValue {
  optional int64 signed_value = 3;
  optional Date date_value = 5;
  optional string string_value = 6;
}

// A point in time, as a decrypted date field carries it.
//
// Whether the double counts from 2001-01-01 or from the Unix epoch is not established, so
// readers should sanity-check the result rather than trust it.
message Date {
  optional double time = 1;
}
