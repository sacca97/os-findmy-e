[package]
name = "adi-core"
version = "0.1.0"
edition = "2021"
description = "Mac CoreADI under Unicorn: a small, dependency-light emulator core for Anisette (MID/OTP)"
license = "GPL-2.0-only"

[lib]
name = "adi_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "adi-cli"
path = "src/main.rs"

[dependencies]
unicorn-engine = { version = "2.1", default-features = false, features = ["arch_x86"] }
sha2 = "0.10"
jni = { version = "0.21", optional = true }

[features]
# JNI entry points for com.sacca.openfinder.adi.CoreAdi (the Android wrapper); build with --features jni
jni = ["dep:jni"]
