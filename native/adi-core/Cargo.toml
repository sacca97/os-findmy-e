[package]
name = "adi-core"
version = "0.1.0"
edition = "2021"
description = "Mac CoreADI under Unicorn: a small, dependency-light emulator core for Anisette (MID/OTP)"
license = "MIT"

[lib]
name = "adi_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "adi-cli"
path = "src/main.rs"

[dependencies]
unicorn-engine = { version = "2.1", default-features = false, features = ["arch_x86"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
