[workspace]
resolver = "2"
members = [
    "adi-core",
    "apple-proto",
    "apple-core",
    "sacca-openfinderlib",
    "findmy-cli",
]

[workspace.package]
edition = "2021"
license = "GPL-2.0-only"
version = "0.1.0"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

# Errors and secrets
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }

# Hashing and symmetric crypto
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes = "0.8"
aes-gcm = "0.10"
aes-siv = "0.7"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }

# Public-key crypto
p224 = { version = "0.13", features = ["arithmetic", "ecdh"] }
p384 = { version = "0.13", features = ["arithmetic", "ecdh", "pkcs8"] }
p256 = { version = "0.13", features = ["arithmetic", "ecdsa", "ecdh"] }
elliptic-curve = { version = "0.13", features = ["sec1", "arithmetic"] }
num-bigint = "0.4"
num-traits = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"

# HTTP (Rust-native TLS; no Android certificate APIs)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

# Protobuf
prost = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3"

# Misc
base64 = "0.22"
plist = "1"
regex = "1"
httpdate = "1"
flate2 = "1"
aes-kw = "0.2"
ghash = "0.5"
universal-hash = "0.5"
time = { version = "0.3", default-features = false, features = ["std", "parsing", "formatting", "macros"] }
tracing = "0.1"

# Local crates
adi-core = { path = "adi-core" }
apple-proto = { path = "apple-proto" }
apple-core = { path = "apple-core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
