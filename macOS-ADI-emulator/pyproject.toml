[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macos-adi-emulator"
version = "0.1.0"
description = "Emulator for Apple's macOS ADI daemon"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["certifi>=2025.1.31", "unicorn>=2.1.1"]

[project.scripts]
macos-adi-emulator = "macos_adi_emulator.provision:main"

[tool.setuptools.packages.find]
where = ["src"]
